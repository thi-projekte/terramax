# Gemeinsamer Portainer-Stack für das gesamte TerraMax-Projekt.
# Jeder Service bekommt hier einen Eintrag. Für die lokale Entwicklung gilt die
# Konfiguration im jeweiligen Service-Ordner (z. B. speech-service/compose-devservices.yml).
# Keycloak läuft in einem eigenen Stack (eigenes Repo) und ist über
# https://terramax-keycloak.winfprojekt.de erreichbar.
#
# Variablen in Portainer (Geheimnisse nie in diese Datei schreiben):
#   OPENAI_API_KEY            Pflicht für Besuchsprotokolle (ohne Key antwortet /protocols mit 502)
#   SPEECH_SERVICE_TAG        optional, Standard latest, z. B. sha-abc1234
#   KAFKA_UI_PASSWORD         Pflicht, Passwort für die Kafka-Entwickler-UI (ohne startet der Stack nicht)
#   KAFKA_UI_USER             optional, Standard terramax

services:
  # --- Spracherkennung (speech-service/README.md) ---

  speech-service:
    # Image aus .github/workflows/speech-service.yml
    image: ghcr.io/thi-projekte/terramax-speech-service:${SPEECH_SERVICE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Öffentliche Adresse, weil sie als Aussteller (iss) in den Tokens steht
      QUARKUS_OIDC_AUTH_SERVER_URL: https://terramax-keycloak.winfprojekt.de/realms/terramax
      # Falls Keycloak beim Start dieses Stacks gerade nicht erreichbar ist
      QUARKUS_OIDC_CONNECTION_DELAY: 3M
      QUARKUS_REST_CLIENT_WHISPER_URL: http://whisper:8000
      # Modell beim Start laden; bis dahin antwortet /transcriptions mit 503
      WHISPER_PRELOAD_MODEL: "true"
      # Besuchsprotokoll per LLM (LangChain4j mit OpenAI); Wert nur in Portainer setzen
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Nur nötig, wenn Frontend und Service auf verschiedenen Domains laufen:
      # QUARKUS_HTTP_CORS_ENABLED: "true"
      # QUARKUS_HTTP_CORS_ORIGINS: https://terramax.winfprojekt.de
    depends_on:
      - whisper
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager
      - speech-intern         # erreicht Whisper

  whisper:
    # Gleicher, getesteter Stand wie in speech-service/compose-devservices.yml
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - speech-intern         # nur intern: nur der speech-service erreicht Whisper

  # --- Kafka-Event-Bus (Topics, Schemas und Betrieb: docs/kafka/README.md) ---
  # Single Node im KRaft-Modus (Broker und Controller in einem Prozess, kein ZooKeeper).
  # Kein Port auf dem Host: Services hängen sich an das Netzwerk kafka-intern und nutzen kafka:9092.

  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    # Zeit für ein sauberes Herunterfahren, sonst können die letzten Nachrichten fehlen
    stop_grace_period: 60s
    environment:
      # Fester Wert, damit das Volume nach einem Redeploy wieder passt (kein Geheimnis)
      CLUSTER_ID: J6XHfx4kRTCvLw4IilnIyA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Ein Broker: interne Topics ohne Replikation
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics nur über kafka-init anlegen, Tippfehler erzeugen keine neuen Topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - kafka-intern          # nur intern, kein Port nach außen

  # Legt die Topics an (idempotent) und beendet sich danach (Status Exited (0) ist richtig).
  # Neue Topics hier und in docs/kafka/README.md ergänzen.
  kafka-init:
    image: apache/kafka:4.3.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in terramax.process.events terramax.speech.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - kafka-intern

  # Entwickler-UI (Topics, Nachrichten, Consumer-Gruppen), über den Nginx Proxy Manager
  # erreichbar (kafka-ui:8080), nur mit Login
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: terramax
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-terramax}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?KAFKA_UI_PASSWORD in Portainer setzen}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager
      - kafka-intern

networks:
  nginx-proxy-manager:
    external: true            # existiert bereits auf dem Host
  speech-intern:
    driver: bridge            # vom Stack verwaltet, Whisper ist von außen nicht erreichbar
  kafka-intern:
    name: terramax-kafka      # fester Name für Testbefehle (docker run --network terramax-kafka)
    driver: bridge            # vom Stack verwaltet, Kafka ist von außen nicht erreichbar

volumes:
  whisper_models:             # heruntergeladene Whisper-Modelle
  kafka_data:
    name: terramax-kafka-data # Topics und Offsets, überleben einen Redeploy
