# Gemeinsamer Portainer-Stack für das gesamte TerraMax-Projekt.
# Jeder Service bekommt hier einen Eintrag. Für die lokale Entwicklung gilt die
# Konfiguration im jeweiligen Service-Ordner (z. B. speech-service/src/main/resources/application.properties).
# Keycloak läuft in einem eigenen Stack (eigenes Repo) und ist über
# https://terramax-keycloak.winfprojekt.de erreichbar.
#
# Variablen in Portainer (Geheimnisse nie in diese Datei schreiben):
#   OPENAI_API_KEY            Pflicht für Spracherkennung und Besuchsprotokolle im speech-service
#                             (ohne Key antworten /transcriptions und /protocols mit 502);
#                             im terramax-service optional (LLM-Priorisierung ist auf Eis)
#   SPEECH_SERVICE_TAG        optional, Standard main, z. B. sha-<commit>
#   SPEECH_TERRAMAX_URL       optional, Adresse des terramax-service für den speech-service,
#                             Standard http://terramax-service:8080
#   KAFKA_UI_PASSWORD         Pflicht, Passwort für die Kafka-Entwickler-UI (ohne startet der Stack nicht)
#   KAFKA_UI_USER             optional, Standard terramax
#   TERRAMAX_DB_PASSWORD      Pflicht, Passwort der TerraMax-Datenbank (ohne startet der Stack nicht)
#   TERRAMAX_CORS_ORIGINS     erlaubte Frontend-Origins des terramax-service, kommagetrennt
#   TERRAMAX_SERVICE_TAG      optional, Standard main, z. B. sha-abc1234
#   TERRAMAX_SEED_ENABLED     optional, Standard true; false, sobald echte CRM-Daten kommen (Testdaten-Import)
#   PROCESS_ENGINE_DB_PASSWORD  Pflicht, Passwort der Engine-Datenbank (ohne startet der Stack nicht)
#   PROCESS_ENGINE_TAG        optional, Standard latest, z. B. sha-abc1234
#   PROCESS_ENGINE_CORS_ORIGINS erlaubte Frontend-Origins der Engine-REST-API, kommagetrennt

#   GEO_DB_USER              optional, Standard terramax_geo
#   GEO_DB_PASSWORD          Pflicht, Passwort der Geo-Datenbank

services:
  # --- TerraMax-Service: fachlicher Kern (terramax-service/README.md) ---
  # Nginx Proxy Manager: <subdomain>.winfprojekt.de -> terramax-terramax-service-1:8080, Let's-Encrypt-Zertifikat

  terramax-service:
    # Image aus .github/workflows/terramax-service.yml
    image: ghcr.io/thi-projekte/terramax-terramax-service:${TERRAMAX_SERVICE_TAG:-main}
    restart: unless-stopped
    environment:
      # Öffentliche Adresse, weil sie als Aussteller (iss) in den Tokens steht
      QUARKUS_OIDC_AUTH_SERVER_URL: https://terramax-keycloak.winfprojekt.de/realms/terramax
      # Falls Keycloak beim Start dieses Stacks gerade nicht erreichbar ist
      QUARKUS_OIDC_CONNECTION_DELAY: 3M
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://terramax-db:5432/terramax
      QUARKUS_DATASOURCE_USERNAME: terramax
      QUARKUS_DATASOURCE_PASSWORD: ${TERRAMAX_DB_PASSWORD:?TERRAMAX_DB_PASSWORD in Portainer setzen}
      CORS_ORIGINS: ${TERRAMAX_CORS_ORIGINS}
      # Optional, die LLM-Priorisierung ist auf Eis. Wert nur in Portainer setzen. Ohne Wert käme ein leerer String
      # an, an dem Quarkus beim Start scheitert; deshalb der Platzhalter (wird im Modus stub nie benutzt)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      # Testhändler und Mock-Kunden beim Start anlegen (legt nur Fehlendes an)
      TERRAMAX_SEED_ENABLED: ${TERRAMAX_SEED_ENABLED:-true}
    depends_on:
      terramax-db:
        condition: service_healthy
    networks:
      # Netzwerkname geklärt (#63): auf dem Server existiert nginx-proxy-manager (Portainer → Networks), nicht nginx-reverse-proxy
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager
      - terramax-intern       # erreicht die Datenbank

  terramax-db:
    # Feste Hauptversion, gleich wie die Dev Services in Tests und lokal
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: terramax
      POSTGRES_USER: terramax
      POSTGRES_PASSWORD: ${TERRAMAX_DB_PASSWORD:?TERRAMAX_DB_PASSWORD in Portainer setzen}
    volumes:
      - terramax_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terramax -d terramax"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - terramax-intern       # nur intern, kein Port nach außen

  # --- Spracherkennung (speech-service/README.md) ---

  speech-service:
    # Image aus .github/workflows/speech-service.yml
    image: ghcr.io/thi-projekte/terramax-speech-service:${SPEECH_SERVICE_TAG:-main}
    restart: unless-stopped
    environment:
      # Öffentliche Adresse, weil sie als Aussteller (iss) in den Tokens steht
      QUARKUS_OIDC_AUTH_SERVER_URL: https://terramax-keycloak.winfprojekt.de/realms/terramax
      # Falls Keycloak beim Start dieses Stacks gerade nicht erreichbar ist
      QUARKUS_OIDC_CONNECTION_DELAY: 3M
      # Spracherkennung (gpt-transcribe) und Besuchsprotokoll (LangChain4j) bei OpenAI; Wert nur in Portainer setzen
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Bestätigte Protokolle gehen mit dem Token der SPA an den terramax-service (Container-Port 8080)
      QUARKUS_REST_CLIENT_TERRAMAX_URL: ${SPEECH_TERRAMAX_URL:-http://terramax-service:8080}
      # Events auf terramax.speech.events (docs/kafka/README.md)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Frontend (terramax.winfprojekt.de) und Service (terramax-speech.winfprojekt.de) laufen auf
      # verschiedenen Domains, deshalb CORS für die SPA freigeben
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: https://terramax.winfprojekt.de
    depends_on:
      - kafka
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager; erreicht darüber auch den terramax-service
      - kafka-intern          # publiziert Events

  # --- Frontend (frontend/README.md) ---
  # Nginx Proxy Manager: terramax.winfprojekt.de -> terramax-frontend-1:80

  frontend:
    # :main = aktueller Stand von main; zum Ausrollen auf :sha-<commit> pinnen
    image: ghcr.io/thi-projekte/terramax-frontend:main
    restart: unless-stopped
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager

  # --- Benachrichtigungen (notification-service/README.md) ---
  # Nginx Proxy Manager: terramax-notifications.winfprojekt.de -> terramax-notification-service-1:8080

  notification-service:
    # Image aus .github/workflows/notification-service.yml; zum Ausrollen auf :sha-<commit> pinnen
    image: ghcr.io/thi-projekte/terramax-notification-service:main
    restart: unless-stopped
    environment:
      # Öffentliche Adresse, weil sie als Aussteller (iss) in den Tokens steht
      QUARKUS_OIDC_AUTH_SERVER_URL: https://terramax-keycloak.winfprojekt.de/realms/terramax
      # Falls Keycloak beim Start dieses Stacks gerade nicht erreichbar ist
      QUARKUS_OIDC_CONNECTION_DELAY: 3M
      # Kafka aus diesem Stack (docs/kafka/README.md)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager
      - kafka-intern          # erreicht Kafka

  # --- Process Engine / CIB seven (process-engine/README.md, Abschnitt "Server") ---
  # Nginx Proxy Manager: <subdomain>.winfprojekt.de -> terramax-process-engine-1:8086, Let's-Encrypt-Zertifikat
  # Erreichbar sind nur /engine-rest (Keycloak-Token nötig, sonst 401) und /actuator/health.
  # Aufrufrichtung: Frontend -> Engine (Tour starten, Aufgaben), Engine -> terramax-service (Tourdaten), nie umgekehrt.

  process-engine:
    # Image aus .github/workflows/process-engine.yml
    image: ghcr.io/thi-projekte/terramax-process-engine:${PROCESS_ENGINE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://process-engine-db:5432/process_engine
      SPRING_DATASOURCE_USERNAME: process_engine
      SPRING_DATASOURCE_PASSWORD: ${PROCESS_ENGINE_DB_PASSWORD:?PROCESS_ENGINE_DB_PASSWORD in Portainer setzen}
      # Öffentliche Adresse, weil sie als Aussteller (iss) in den Tokens steht
      KEYCLOAK_ISSUER_URL: https://terramax-keycloak.winfprojekt.de/realms/terramax
      # Tourdaten (Single Source of Truth), erreichbar über das gemeinsame Netzwerk nginx-proxy-manager
      TERRAMAX_SERVICE_URL: http://terramax-service:8080
      CORS_ORIGINS: ${PROCESS_ENGINE_CORS_ORIGINS}
      # Prozess-Events nach docs/kafka/README.md
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      process-engine-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager, erreicht den terramax-service
      - process-engine-intern # erreicht die Datenbank
      - kafka-intern          # publiziert Prozess-Events

  # Eigene PostgreSQL-Datenbank der Engine (Runtime- und History-Tabellen), nur intern erreichbar, kein ports:.
  # Die Engine legt die Tabellen beim Start selbst an (camunda.bpm.database.schema-update).
  process-engine-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: process_engine
      POSTGRES_USER: process_engine
      POSTGRES_PASSWORD: ${PROCESS_ENGINE_DB_PASSWORD:?PROCESS_ENGINE_DB_PASSWORD in Portainer setzen}
    volumes:
      - process_engine_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U process_engine -d process_engine"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - process-engine-intern # nur intern

  # --- Kafka-Event-Bus (Topics, Schemas und Betrieb: docs/kafka/README.md) ---
  # Single Node im KRaft-Modus (Broker und Controller in einem Prozess, kein ZooKeeper).
  # Kein Port auf dem Host: Services hängen sich an das Netzwerk kafka-intern und nutzen kafka:9092.

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    # Zeit für ein sauberes Herunterfahren, sonst können die letzten Nachrichten fehlen
    stop_grace_period: 60s
    environment:
      # Fester Wert, damit das Volume nach einem Redeploy wieder passt (kein Geheimnis)
      CLUSTER_ID: J6XHfx4kRTCvLw4IilnIyA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Ein Broker: interne Topics ohne Replikation
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics nur über kafka-init anlegen, Tippfehler erzeugen keine neuen Topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - kafka-intern          # nur intern, kein Port nach außen

  # Legt die Topics an (idempotent) und beendet sich danach (Status Exited (0) ist richtig).
  # Neue Topics hier und in docs/kafka/README.md ergänzen.
  kafka-init:
    image: apache/kafka:4.4.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in terramax.process.events terramax.speech.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - kafka-intern

  # Entwickler-UI (Topics, Nachrichten, Consumer-Gruppen), über den Nginx Proxy Manager
  # erreichbar (kafka-ui:8080), nur mit Login
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: terramax
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-terramax}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?KAFKA_UI_PASSWORD in Portainer setzen}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager
      - kafka-intern

  # --- Geo-Service (Ticket #65) ---

  geo-service:
    image: ghcr.io/thi-projekte/terramax-geo-service:main
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: ${GEO_DB_USER:-terramax_geo}
      QUARKUS_DATASOURCE_PASSWORD: ${GEO_DB_PASSWORD:?GEO_DB_PASSWORD in Portainer setzen}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://geo-db:5432/terramax_geo
      QUARKUS_OIDC_AUTH_SERVER_URL: https://terramax-keycloak.winfprojekt.de/realms/terramax
      QUARKUS_OIDC_CONNECTION_DELAY: 3M
    depends_on:
      geo-db:
        condition: service_healthy
    networks:
      - nginx-proxy-manager
      - geo-intern

  geo-db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: terramax_geo
      POSTGRES_USER: ${GEO_DB_USER:-terramax_geo}
      POSTGRES_PASSWORD: ${GEO_DB_PASSWORD:?GEO_DB_PASSWORD in Portainer setzen}
    volumes:
      - geo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - geo-intern

networks:
  nginx-proxy-manager:
    external: true            # existiert bereits auf dem Host
  kafka-intern:
    name: terramax-kafka      # fester Name für Testbefehle (docker run --network terramax-kafka)
    driver: bridge            # vom Stack verwaltet, Kafka ist von außen nicht erreichbar
  terramax-intern:
    driver: bridge            # vom Stack verwaltet, die TerraMax-Datenbank ist von außen nicht erreichbar
  process-engine-intern:
    driver: bridge            # vom Stack verwaltet, die Engine-Datenbank ist von außen nicht erreichbar

  geo-intern:
    driver: bridge

volumes:
  kafka_data:
    name: terramax-kafka-data # Topics und Offsets, überleben einen Redeploy
  terramax_db_data:
    name: terramax-db-data    # Händler-, Kunden-, Tour- und Protokolldaten, überleben einen Redeploy
  process_engine_db:
    name: terramax-process-engine-db # Prozesszustand und History, überleben einen Redeploy
  geo_db_data:
