
# ==========================================
# TerraMax Geo-Service – Ticket #65
# ==========================================

# ------------------------------------------
# Keycloak / OIDC
# ------------------------------------------

# Keycloak-Client
quarkus.oidc.client-id=terramax-hello-world

# Lokale Entwicklung: Keycloak Dev Services
# Gleicher Realm wie beim Speech-Service
%dev.quarkus.keycloak.devservices.realm-path=../hello-service/src/main/resources/terramax-realm.json

# Fester Keycloak-Port für das Frontend
%dev.quarkus.keycloak.devservices.port=8180

# Mehr Startzeit für Keycloak erlauben
%dev.quarkus.devservices.timeout=5M

# ------------------------------------------
# HTTP / CORS
# ------------------------------------------

# Geo-Service läuft lokal auf Port 8083
%dev.quarkus.http.port=8083

# React-Frontend auf Port 5173 zulassen
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# Produktivbetrieb: TerraMax-Frontend zulassen
%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=https://terramax.winfprojekt.de

# ------------------------------------------
# PostgreSQL / PostGIS
# ------------------------------------------

quarkus.datasource.db-kind=postgresql

# Lokale Datenbankverbindung
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/terramax_geo
%dev.quarkus.datasource.username=terramax_geo
%dev.quarkus.datasource.password=${GEO_DB_PASSWORD}

# ------------------------------------------
# Flyway – Datenbankmigration
# ------------------------------------------

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%test.quarkus.datasource.devservices.image-name=postgis/postgis:16-3.4