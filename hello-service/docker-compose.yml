
services:
  hello-service:
image: ghcr.io/thi-projekte/terramax-hello-service:sha-cbbb807
    restart: unless-stopped

    environment:
      QUARKUS_OIDC_AUTH_SERVER_URL: ${QUARKUS_OIDC_AUTH_SERVER_URL:?Keycloak-Realm-URL erforderlich}
