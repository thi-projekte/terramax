# Dev mode: load the realm directly from the sibling keycloak-ws2627 repo (path relative to hello-service/)
%dev.quarkus.keycloak.devservices.realm-path=../../keycloak-ws2627/terramax-realm.json
# Tests/CI: the sibling repo is not checked out there, so fall back to the bundled classpath copy
quarkus.keycloak.devservices.realm-path=terramax-realm.json
quarkus.oidc.client-id=terramax-hello-world
# Das Frontend (Vite, Port 5173) darf das Backend im Browser aufrufen
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173
# --- Lokale Entwicklung mit dem React-Frontend (#23) ---
# Fester Port für den Dev-Services-Keycloak, damit das Frontend ihn unter http://localhost:8180 findet
%dev.quarkus.keycloak.devservices.port=8180