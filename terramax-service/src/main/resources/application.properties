# Dev und Tests: Keycloak Dev Services mit dem Realm aus dem Classpath (Kopie aus dem hello-service,
# Testnutzer sales und dealer mit Rollen und dealer_id = D-100)
quarkus.keycloak.devservices.realm-path=terramax-realm.json
# Fester Port wie im hello-service, damit das Frontend den lokalen Keycloak unter http://localhost:8180 findet
%dev.quarkus.keycloak.devservices.port=8180
# Den Keycloak-Container teilen sich die Services. Wer ihn nicht selbst startet, nutzt sonst den Realm "quarkus"
# statt "terramax" und lehnt die Tokens des Frontends mit 401 ab.
%dev.quarkus.keycloak.devservices.realm-name=terramax
# Keycloak braucht beim Start oft länger als die standardmäßigen 60 Sekunden
quarkus.devservices.timeout=5M
quarkus.oidc.client-id=terramax-hello-world
# Lokal 8088, damit der Service neben hello-service (8080), speech-service (8082), tour-service (8084),
# process-engine (8086) und Keycloak (8180) läuft. In prod gilt der Quarkus-Standard 8080, Tests nutzen den Testport
%dev.quarkus.http.port=8088

# OIDC: reiner Resource-Server, prueft nur Bearer-Tokens (kein Login-Redirect)
quarkus.oidc.application-type=service
# Dev und Test: bewusst kein Wert. Dann starten die Keycloak Dev Services mit dem Testrealm und setzen die Adresse
# selbst. Ein leerer Default (frueher %dev...=${OIDC_AUTH_SERVER_URL:}) ueberschrieb diese Adresse, jeder Aufruf mit
# Token endete dann mit 500.
# Lokal gegen den Team-Keycloak pruefen: QUARKUS_OIDC_AUTH_SERVER_URL setzen, z. B.
#   QUARKUS_OIDC_AUTH_SERVER_URL=https://terramax-keycloak.winfprojekt.de/realms/terramax
# Dann startet kein lokaler Keycloak. ./mvnw verify laeuft immer gegen den Testrealm.
# In prod gibt es keinen Default: ohne OIDC_AUTH_SERVER_URL (oder QUARKUS_OIDC_AUTH_SERVER_URL, wie im Stack)
# startet der Service nicht. QUARKUS_OIDC_AUTH_SERVER_URL ueberschreibt den Wert.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}

# CORS fuer das Frontend. Mehrere Origins kommagetrennt in CORS_ORIGINS, niemals "*"
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type

# Datenbank: PostgreSQL. Ohne gesetzte URL/Zugangsdaten startet Quarkus im Dev-Modus und in Tests
# automatisch einen Container (Dev Services, Docker). Fuer prod werden URL/User/Passwort per
# Umgebungsvariablen gesetzt (QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD).
quarkus.datasource.db-kind=postgresql
# Gleiche Hauptversion wie terramax-db im docker-compose.yml
quarkus.datasource.devservices.image-name=postgres:17

# Schema wird ausschliesslich von Flyway verwaltet, Hibernate erzeugt/aendert nichts
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Import der Standortdaten beim Start (Classpath-Ressourcen, kommagetrennt). Angelegt wird nur, wessen
# externe ID noch nicht existiert; bestehende Eintraege werden nicht ueberschrieben
location.import.enabled=true
location.import.files=data/competitors_at_v2.geojson,data/john_deere_at.geojson

# Testdaten für Händler und Kunden (SeedImporter), läuft nach dem Standort-Import. Wie dort wird nur angelegt, was
# noch nicht existiert. Händler: John-Deere-Standorte (16) und der Testhändler D-100 (dealer_id der Testnutzer
# sales und dealer im Realm). Kunden: 18 Mock-Kunden, alle bei D-100.
# Default true, damit der Server nach dem ersten Deploy Daten hat. Abschalten mit TERRAMAX_SEED_ENABLED=false,
# sobald echte CRM-Daten kommen.
terramax.seed.enabled=true
terramax.seed.dealer-files=data/john_deere_at.geojson,data/test_dealers.geojson
terramax.seed.customer-files=data/mock_customers.geojson
terramax.seed.customer-dealer-id=D-100

# JaCoCo: quarkus-jacoco haengt an target/jacoco-quarkus.exec des jacoco-maven-plugin an (Standardpfad);
# den Bericht erzeugt das Maven-Plugin in der Phase verify (target/jacoco-report)
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false

# OpenAPI: Doku unter /q/openapi, Swagger UI unter /q/swagger-ui, auch im Container (prod), damit die Engine-Entwickler
# die Endpunkte samt Beispielen direkt am Server sehen. Die UI selbst ist ohne Token erreichbar, jeder Aufruf daraus
# braucht ein Token (Knopf Authorize). Das Bearer-Schema ist per Annotation in TerraMaxApplication definiert, daher
# kein zusaetzliches automatisches OIDC-Schema
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.always-include=true

# --- Priorisierung der Besuche (de.thi.terramax.ai) ---
# stub: "am längsten nicht besucht", Grundlage von GET /tours/plan (Standard). llm: OpenAI über LangChain4j.
# AUF EIS: llm ist vorbereitet, aber bis zur Abstimmung der Kriterien nicht im Einsatz; stub bleibt der Standard
terramax.prioritizer.mode=stub

# --- OpenAI-LLM (LangChain4j, wie im speech-service), AUF EIS ---
# OPENAI_API_KEY ist optional (lokal in terramax-service/.env, auf dem Server in Portainer). Ohne Key startet der
# Service normal; nur der Modus llm würde dann fehlschlagen.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-configured}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.2
# Antwort muss exakt dem Schema von VisitPrioritization entsprechen (OpenAI Structured Outputs)
quarkus.langchain4j.openai.chat-model.response-format=json_schema
quarkus.langchain4j.openai.chat-model.strict-json-schema=true
quarkus.langchain4j.openai.timeout=60s
# Kundendaten nicht ins Log schreiben
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# --- process-engine (CIB Seven) ---
# Nur die Engine ruft TerraMax auf, nie umgekehrt; deshalb gibt es hier keinen Client zur Engine.
# Endpunkte für die Engine und Service-Konto: ../docs/process/terramax-engine-schnittstelle.md
