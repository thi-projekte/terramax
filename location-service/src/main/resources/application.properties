# Dev mode: load the realm directly from the sibling keycloak-ws2627 repo (path relative to location-service/)
%dev.quarkus.keycloak.devservices.realm-path=../../keycloak-ws2627/terramax-realm.json
# Tests/CI: the sibling repo is not checked out there, so fall back to the bundled classpath copy
quarkus.keycloak.devservices.realm-path=terramax-realm.json
quarkus.oidc.client-id=terramax-hello-world
quarkus.http.port=8082

# OIDC: reiner Resource-Server, prueft nur Bearer-Tokens (kein Login-Redirect)
quarkus.oidc.application-type=service
# Optional gegen den Team-Keycloak pruefen, z. B.
#   OIDC_AUTH_SERVER_URL=https://terramax-keycloak.winfprojekt.de/realms/terramax
# Ohne Variable ist der Wert leer: dann starten im Dev-Modus die Keycloak Dev Services mit dem Testrealm.
# Fuer das Profil test bewusst nicht gesetzt, damit ./mvnw verify nie gegen den Team-Keycloak laeuft.
# In prod gibt es keinen Default: ohne OIDC_AUTH_SERVER_URL (oder QUARKUS_OIDC_AUTH_SERVER_URL) startet
# der Service nicht. QUARKUS_OIDC_AUTH_SERVER_URL ueberschreibt beides (Server-Konfiguration wie im hello-service).
%dev.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:}
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}

# CORS fuer das Frontend. Mehrere Origins kommagetrennt in CORS_ORIGINS, niemals "*"
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type

# Datenbank: PostgreSQL. Ohne gesetzte URL/Zugangsdaten startet Quarkus im Dev-Modus und in Tests
# automatisch einen Container (Dev Services, Docker). Fuer prod werden URL/User/Passwort per
# Umgebungsvariablen gesetzt (QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD).
quarkus.datasource.db-kind=postgresql

# Schema wird ausschliesslich von Flyway verwaltet, Hibernate erzeugt/aendert nichts
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Import der Standortdaten aus data/competitors_at_v2.geojson beim Start (nur wenn Tabelle leer)
location.import.enabled=true

# JaCoCo: quarkus-jacoco haengt an target/jacoco-quarkus.exec des jacoco-maven-plugin an (Standardpfad);
# den Bericht erzeugt das Maven-Plugin in der Phase verify (target/jacoco-report)
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false

# OpenAPI: Doku unter /q/openapi, Swagger UI unter /q/swagger-ui (dev/test). Das Bearer-Schema ist per
# Annotation in LocationServiceApplication definiert, daher kein zusaetzliches automatisches OIDC-Schema
quarkus.smallrye-openapi.auto-add-security=false
