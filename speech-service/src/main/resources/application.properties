# --- OpenAI: ein Key für Spracherkennung und Protokoll ---
# Key nur per Umgebungsvariable OPENAI_API_KEY (lokal in speech-service/.env, auf dem Server in Portainer).
# Ohne Key startet der Service trotzdem; /transcriptions und /protocols antworten dann mit 502.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-configured}

# --- Spracherkennung (OpenAI, POST /v1/audio/transcriptions) ---
quarkus.rest-client.openai-transcription.url=https://api.openai.com/v1
quarkus.rest-client.openai-transcription.connect-timeout=10000
# Eine Notiz von 2 Minuten braucht deutlich weniger; Puffer für langsame Uploads
quarkus.rest-client.openai-transcription.read-timeout=120000
# Empfohlenes Modell; whisper-1 und gpt-4o-(mini-)transcribe sind abgekündigt (Abschaltung 26.02.2027)
transcription.model=gpt-transcribe
transcription.languages=de
transcription.prompt=Besuchsprotokoll eines John Deere Vertriebsmitarbeiters nach einem Kundenbesuch in der Landwirtschaft.
# Fachbegriffe, die richtig geschrieben werden sollen (kommagetrennt)
transcription.keywords=John Deere,8R 410,6R 250,S 780,Mähdrescher,Operations Center,AutoTrac,Fendt,Claas,Follow-up

# --- Protokoll per LLM (LangChain4j mit OpenAI) ---
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
# Niedrig, damit das Protokoll nah am Transkript bleibt
quarkus.langchain4j.openai.chat-model.temperature=0.1
# Antwort muss exakt dem Schema von VisitProtocol entsprechen (OpenAI Structured Outputs)
quarkus.langchain4j.openai.chat-model.response-format=json_schema
quarkus.langchain4j.openai.chat-model.strict-json-schema=true
quarkus.langchain4j.openai.timeout=60s
# Transkripte und Protokolle nicht ins Log schreiben
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# --- TerraMax (terramax-service): bestätigte Protokolle übergeben ---
# Lokal läuft der terramax-service auf 8088; auf dem Server per QUARKUS_REST_CLIENT_TERRAMAX_URL
quarkus.rest-client.terramax.url=http://localhost:8088
quarkus.rest-client.terramax.connect-timeout=5000
quarkus.rest-client.terramax.read-timeout=15000

# --- Events nach Kafka (docs/kafka/README.md) ---
# Auf dem Server per KAFKA_BOOTSTRAP_SERVERS=kafka:9092; lokal startet Quarkus Dev Services einen Broker
mp.messaging.outgoing.speech-events.connector=smallrye-kafka
mp.messaging.outgoing.speech-events.topic=terramax.speech.events
mp.messaging.outgoing.speech-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.speech-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- WebSocket ---
# Browser schicken das Token als Subprotocol "quarkus-http-upgrade#Authorization#Bearer%20<token>" und
# zusätzlich "bearer-token-carrier", auf das sich Client und Server einigen
quarkus.websockets-next.server.supported-subprotocols=bearer-token-carrier

# --- Uploads ---
# Eine WAV-Aufnahme von 2 Minuten hat etwa 5 MB, WebM deutlich weniger. Größere Anfragen: 413
quarkus.http.limits.max-body-size=10M
# Audio nicht auf der Platte liegen lassen
quarkus.http.body.delete-uploaded-files-on-end=true

# --- Lokale Entwicklung ---
%dev.quarkus.http.port=8082
quarkus.http.test-port=8083
# Gleicher Realm und fester Port wie im hello-service, damit das Frontend ihn unter localhost:8180 findet
%dev.quarkus.keycloak.devservices.realm-path=../hello-service/src/main/resources/terramax-realm.json
%dev.quarkus.keycloak.devservices.port=8180
# Den Keycloak-Container teilen sich die Services. Wer ihn nicht selbst startet, nutzt sonst den Realm "quarkus"
# statt "terramax" und lehnt die Tokens des Frontends mit 401 ab.
%dev.quarkus.keycloak.devservices.realm-name=terramax
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173
# Keycloak braucht beim Start oft länger als die standardmäßigen 60 Sekunden
%dev.quarkus.devservices.timeout=5M

# --- Tests ---
# Anmeldung, Spracherkennung und LLM werden in den Tests simuliert; Keycloak und ein OpenAI-Key sind nicht nötig
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
# Der echte Transkriptions-Client läuft gegen eine Test-Resource im selben Prozess (FakeOpenAi)
%test.quarkus.rest-client.openai-transcription.url=http://localhost:${quarkus.http.test-port}/fake-openai
%test.quarkus.langchain4j.openai.api-key=test-key
# Kafka ersetzt der In-Memory-Connector, TerraMax eine Test-Resource im selben Prozess (FakeTerraMax)
%test.quarkus.kafka.devservices.enabled=false
%test.mp.messaging.outgoing.speech-events.connector=smallrye-in-memory
%test.quarkus.rest-client.terramax.url=http://localhost:${quarkus.http.test-port}/fake-terramax
