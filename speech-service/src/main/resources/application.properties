# --- Spracherkennung (Whisper über Speaches, OpenAI-kompatible Schnittstelle) ---
# Auf dem Server per Umgebungsvariable QUARKUS_REST_CLIENT_WHISPER_URL setzen
quarkus.rest-client.whisper.url=http://localhost:8000
# Eine Notiz von 2 Minuten braucht auf der CPU etwa 45 Sekunden
quarkus.rest-client.whisper.read-timeout=120000
quarkus.rest-client.whisper-models.url=${quarkus.rest-client.whisper.url}
quarkus.rest-client.whisper-models.read-timeout=600000

whisper.model=Systran/faster-whisper-small
whisper.language=de
whisper.prompt=Besuchsprotokoll eines John Deere Vertriebsmitarbeiters. Begriffe: John Deere, 8R 410, 6R 250, S 780, Mähdrescher, Operations Center, AutoTrac, Fendt, Claas, Follow-up.
%dev.whisper.preload-model=true
# Heruntergeladene Modelle beim Beenden nicht löschen (Volume aus compose-devservices.yml)
%dev.quarkus.compose.devservices.remove-volumes=false

# --- Protokoll per LLM (LangChain4j mit OpenAI) ---
# Key nur per Umgebungsvariable OPENAI_API_KEY (lokal in speech-service/.env, auf dem Server in Portainer).
# Ohne Key startet der Service trotzdem; /protocols antwortet dann mit 502.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-configured}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
# Niedrig, damit das Protokoll nah am Transkript bleibt
quarkus.langchain4j.openai.chat-model.temperature=0.1
# Antwort muss exakt dem Schema von VisitProtocol entsprechen (OpenAI Structured Outputs)
quarkus.langchain4j.openai.chat-model.response-format=json_schema
quarkus.langchain4j.openai.chat-model.strict-json-schema=true
quarkus.langchain4j.openai.timeout=60s
# Transkripte und Protokolle nicht ins Log schreiben
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# --- Uploads ---
# Eine WAV-Aufnahme von 2 Minuten hat etwa 5 MB, WebM deutlich weniger. Größere Anfragen: 413
quarkus.http.limits.max-body-size=10M
# Audio nicht auf der Platte liegen lassen
quarkus.http.body.delete-uploaded-files-on-end=true

# --- Lokale Entwicklung ---
%dev.quarkus.http.port=8082
quarkus.http.test-port=8083
# Gleicher Realm und fester Port wie im hello-service, damit das Frontend ihn unter localhost:8180 findet
%dev.quarkus.keycloak.devservices.realm-path=../hello-service/src/main/resources/terramax-realm.json
%dev.quarkus.keycloak.devservices.port=8180
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173
# Keycloak braucht beim Start oft länger als die standardmäßigen 60 Sekunden
%dev.quarkus.devservices.timeout=5M

# --- Tests ---
# Anmeldung, Whisper und LLM werden in den Tests simuliert; Keycloak, Whisper und OpenAI-Key sind nicht nötig
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.compose.devservices.enabled=false
