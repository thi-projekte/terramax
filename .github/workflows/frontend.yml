
name: TerraMax Frontend CI

on:
  push:
    branches:
      - main
      - feature/17-h3-market-map
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL || 'https://terramax-keycloak.winfprojekt.de' }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8080' }}
          VITE_LOCATION_SERVICE_URL: ${{ vars.VITE_LOCATION_SERVICE_URL || 'http://localhost:8088' }}
          VITE_ENGINE_URL: ${{ vars.VITE_ENGINE_URL || 'http://localhost:8086/engine-rest' }}
          VITE_SPEECH_API_URL: ${{ vars.VITE_SPEECH_API_URL || 'https://terramax-speech.winfprojekt.de' }}
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image-Tags nach https://winfprojekt.de/docs/technik/semver (Git-Tag v1.2.0 -> 1.2.0, 1.2, latest)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/thi-projekte/terramax-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_MAPBOX_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL || 'https://terramax-keycloak.winfprojekt.de' }}
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8080' }}
            VITE_LOCATION_SERVICE_URL=${{ vars.VITE_LOCATION_SERVICE_URL || 'http://localhost:8088' }}
            VITE_ENGINE_URL=${{ vars.VITE_ENGINE_URL || 'http://localhost:8086/engine-rest' }}
            VITE_SPEECH_API_URL=${{ vars.VITE_SPEECH_API_URL || 'https://terramax-speech.winfprojekt.de' }}
