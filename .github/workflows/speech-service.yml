name: speech-service

on:
  push:
    branches: [main]
    tags: ["speech-*"]
    paths:
      - "speech-service/**"
      - "config/formatter/**"
      - ".github/workflows/speech-service.yml"
  pull_request:
    paths:
      - "speech-service/**"
      - "config/formatter/**"
      - ".github/workflows/speech-service.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/terramax-speech-service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: speech-service

    # Actions sind auf Commit-Hashes gepinnt (Tags können nachträglich verschoben werden)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        # Git-Tag speech-1.2.3 -> Image-Tags 1.2.3, 1.2, latest (siehe README, Abschnitt Release)
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # main (Stand von main) und sha-<voller Commit-Hash>, wie in Issue #66 gefordert
          tags: |
            type=match,pattern=speech-(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=speech-(\d+\.\d+)\.\d+$,group=1
            type=ref,event=branch
            type=sha,format=long
            type=ref,event=pr

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: speech-service
          file: speech-service/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
