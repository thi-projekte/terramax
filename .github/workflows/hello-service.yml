
name: Hello Service CI

on:
  push:
    paths:
      - "hello-service/**"
      - ".github/workflows/hello-service.yml"
  pull_request:
    paths:
      - "hello-service/**"
      - ".github/workflows/hello-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  Packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hello-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: hello-service/pom.xml

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      
      
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Build Docker image
        run: |
          docker build \
            -f src/main/docker/Dockerfile.jvm \
            -t ghcr.io/thi-projekte/terramax-hello-service:sha-${GITHUB_SHA::7} \
            .

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/thi-projekte/terramax-hello-service:sha-${GITHUB_SHA::7}

      - name: Tag and push main image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag \
            ghcr.io/thi-projekte/terramax-hello-service:sha-${GITHUB_SHA::7} \
            ghcr.io/thi-projekte/terramax-hello-service:main
          docker push ghcr.io/thi-projekte/terramax-hello-service:main

